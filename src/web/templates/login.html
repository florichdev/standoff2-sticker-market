<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация</title>

  <!-- Google Fonts: Unbounded & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&family=Unbounded:wght@300..900&display=swap" rel="stylesheet">

  <!-- Minimalist Grayscale Theme Stylesheet -->
  <link rel="stylesheet" href="/static/css/admin.css?v=2.3">
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-header" style="text-align: center;">
    <h1 class="login-title" style="text-align: center;">Вход</h1>
    <p class="login-subtitle" id="login-clock" style="text-align: center; color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums;">--:--:-- MSK (UTC+3)</p>
  </div>

  {% if error %}
    <div class="login-alert">
      {{ error }}
    </div>
  {% endif %}

  <form method="POST" action="/admin/login">
    <div class="form-group">
      <label class="form-label" for="secret-key">Пароль</label>
      <input 
        type="password" 
        id="secret-key" 
        name="secret" 
        class="form-input" 
        placeholder="••••••••••••" 
        required 
        autofocus
      >
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 4px;" id="btn-login-submit">
      Войти
    </button>
  </form>
</div>

<script>
function updateMoscowClock() {
  const clockEl = document.getElementById('login-clock');
  if (!clockEl) return;
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour12: false });
  clockEl.textContent = `${timeStr} MSK (UTC+3)`;
}
updateMoscowClock();
setInterval(updateMoscowClock, 1000);
</script>

</body>
</html>
